name: blowy-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blowy
      POSTGRES_PASSWORD: blowy
      POSTGRES_DB: blowy
    # Surchargeable si un Postgres natif (Homebrew, Postgres.app) occupe déjà 5432 :
    # BLOWY_PG_PORT=5433 pnpm infra:up  puis  DATABASE_URL=postgresql://blowy:blowy@localhost:5433/blowy
    ports: ['${BLOWY_PG_PORT:-5432}:5432']
    volumes: ['pg:/var/lib/postgresql/data', './postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blowy']
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ['${BLOWY_REDIS_PORT:-6379}:6379']
  # Stockage S3 local. MinIO a retiré minio/minio de Docker Hub (et l'image Quay renvoie 401) :
  # on utilise la build Chainguard du même serveur MinIO, même API S3. Voir docs/decisions.md D-009.
  s3:
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: blowy-local
      MINIO_ROOT_PASSWORD: blowy-local-secret
    # Ports hôte 9100/9101 par défaut (9000 est souvent déjà pris : autre MinIO, Portainer, php-fpm…).
    # Surchargeables : BLOWY_S3_PORT=9000 BLOWY_S3_CONSOLE_PORT=9001 pnpm infra:up
    ports: ['${BLOWY_S3_PORT:-9100}:9000', '${BLOWY_S3_CONSOLE_PORT:-9101}:9001']
    volumes: ['s3:/data']
  # Émulateur Firebase Auth : optionnel (le mode local utilise LocalAuthProvider).
  # Activer avec : docker compose -f infra/compose.yaml --profile firebase up -d
  firebase-auth-emulator:
    profiles: ['firebase']
    image: eclipse-temurin:21-jre
    working_dir: /emu
    command: sh -c "apt-get update -qq && apt-get install -y -qq nodejs npm >/dev/null && npx -y firebase-tools@latest emulators:start --only auth --project demo-blowy"
    volumes: ['./firebase:/emu']
    ports: ['9099:9099']
volumes:
  pg: {}
  s3: {}
