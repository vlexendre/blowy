<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8A7E70;margin:0 4px}
.grp{background:#fff;border-radius:20px;box-shadow:0 4px 0 #EEDFCB;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;font-size:14px;font-weight:700;white-space:nowrap;border-top:1px solid #F4EADC}
.row:first-child{border-top:0}
.ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.val{margin-left:auto;font-size:12px;font-weight:600;color:#8A7E70}
.chev{margin-left:6px;flex:0 0 auto}
@keyframes pop{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop .45s cubic-bezier(.2,1.2,.3,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; padding: 52px 16px 20px; gap: 10px; position: relative">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px">
    <a href="V5-Profil.dc.html" aria-label="Retour au profil" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="d" style="margin: 0; font-size: 38px">RÉGLAGES</h1>
  </div>

  <span class="lbl pop">Compte</span>
  <div class="grp pop" style="animation-delay: .04s">
    <div class="row"><span class="ico" style="background: #FFE3D9"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="#FF5A3C"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" fill="#FF5A3C"/></svg></span>Prénom et photos<span class="val">Alex · 2 photos</span></div>
    <a href="V5-Toi.dc.html" class="row"><span class="ico" style="background: #EDE4FF"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.4" fill="#7C3AED"/><circle cx="16" cy="9" r="3.4" fill="#FF3D7F"/><path d="M3 20c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2" fill="#7C3AED"/></svg></span>Genre et qui je rencontre<span class="val">modifier</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#16110D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div style="display: none"></div>
    <a href="V5-Abonnement.dc.html" class="row"><span class="ico" style="background: #E8F9C8"><img src="/_blob/79c80e7b551bb0b08bbbac244350b5ec" alt="" aria-hidden="true" style="width: 20px; height: 20px"></span>Blowy+<span class="val">gratuit · voir</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#16110D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>

  <span class="lbl pop" style="animation-delay: .08s">Notifications</span>
  <div class="grp pop" style="animation-delay: .1s">
    <sc-for list="{{notifs}}" as="n" hint-placeholder-count="3">
      <label class="row" style="cursor: pointer"><span class="ico" style="background: {{n.tint}}"><img src="{{n.img}}" alt="" aria-hidden="true" style="width: 20px; height: 20px; object-fit: contain"></span>{{n.l}}
        <button type="button" role="switch" aria-checked="{{n.on}}" aria-label="{{n.l}}" onClick="{{n.toggle}}" style="margin-left: auto; width: 50px; height: 30px; border-radius: 999px; border: 0; cursor: pointer; padding: 3px; background: {{n.bg}}; display: flex; justify-content: {{n.jc}}; transition: background .2s"><span style="width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15)"></span></button>
      </label>
    </sc-for>
  </div>

  <span class="lbl pop" style="animation-delay: .14s">Sécurité</span>
  <div class="grp pop" style="animation-delay: .16s">
    <a href="V5-Confidentialite.dc.html" class="row"><span class="ico" style="background: #EDE4FF"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z" fill="#7C3AED"/></svg></span>Confidentialité et sécurité<svg class="chev" style="margin-left: auto" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#16110D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="V5-Rupture.dc.html" class="row"><span class="ico" style="background: #FDE6EE"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#FF3D7F"/></svg></span>Partir proprement<span class="val">bande ou duo</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="#16110D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="row"><span class="ico" style="background: #FFF1C9"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="#C97A12" stroke-width="2.4" fill="none"/><path d="M12 8v5M12 16h.01" stroke="#C97A12" stroke-width="2.6" stroke-linecap="round"/></svg></span>Ange gardien<span class="val">Sam · par SMS</span></div>
  </div>

  <div class="grp pop" style="animation-delay: .22s; margin-top: 4px">
    <a href="V5-Welcome.dc.html" class="row">Se déconnecter</a>
    <a href="V5-Supprimer.dc.html" class="row" style="color: #D92D2D">Supprimer mon compte</a>
  </div>

  <span class="pop" style="animation-delay: .26s; margin-top: auto; text-align: center; font-size: 11px; font-weight: 600; color: #A79C90">blowy. v1.0 · fait à Paris</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: { pet: true, partner: true, streak: false } }; }
  renderVals() {
    const B = '/_blob/';
    const N = [
      { id: 'pet', l: 'Rappels de sortie', img: B + 'cf3f73060c502cc8dbf1ef34785e8aef', tint: '#FFF1C9' },
      { id: 'partner', l: 'Messages (groupe, bande, duo)', img: B + 'f22ec297b35d3fd95af3a884388d70a4', tint: '#EDE4FF' },
      { id: 'streak', l: 'Mode discret', img: B + '0aab81f3b21c416369cdfa4be1f82186', tint: '#FFE3D9' }
    ];
    const notifs = N.map((n) => { const on = this.state.n[n.id]; return { ...n, on: on ? 'true' : 'false', bg: on ? '#C8F542' : '#E3D6C3', jc: on ? 'flex-end' : 'flex-start', toggle: () => this.setState({ n: { ...this.state.n, [n.id]: !on } }) }; });
    return { notifs };
  }
}
</script>
</body>
</html>
