<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}

.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;font-size:14px;font-weight:700;border-top:1px solid #F4EADC;box-sizing:border-box}
.row:first-child{border-top:0}
.val{margin-left:auto;font-size:12px;font-weight:600;color:#6F6458;text-align:right}
.ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cap{display:inline-block;background:#16110D;color:#fff;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600}
.them{align-self:flex-start;max-width:270px;background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #EEDFCB}
.me{align-self:flex-end;max-width:270px;background:linear-gradient(135deg,#C2185B,#C4341B);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #8E1B10}
.sw{margin-left:auto;width:54px;height:44px;border:0;cursor:pointer;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sw i{width:50px;height:30px;border-radius:999px;padding:3px;box-sizing:border-box;display:flex}
.sw i b{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pill{min-height:44px;min-width:44px;padding:0 12px;border-radius:14px;border:0;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:800;white-space:nowrap}
.gnav{position:absolute;left:14px;right:14px;bottom:18px;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px;border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.8));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 16px 36px rgba(22,17,13,.24),0 2px 6px rgba(22,17,13,.08);overflow:hidden}
.gnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:28px;font-family:'Inter',sans-serif;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#4E453C}
.gnav a.on{color:#16110D;background:linear-gradient(180deg,rgba(214,250,110,.95),rgba(200,245,66,.85))}
.gnav .bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#C2185B;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ring{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.r1{animation:ring 2.4s ease-out infinite}.r2{animation:ring 2.4s ease-out .8s infinite}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.sk{background:linear-gradient(90deg,#F2E6D6 0,#FBF3E8 60px,#F2E6D6 120px);background-size:400px 100%;animation:shimmer 1.4s linear infinite;border-radius:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; padding: 52px 20px 22px; position: relative">
  <div class="blob" aria-hidden="true" style="width: 300px; height: 300px; top: 300px; left: -170px; background: #FF3D7F; opacity: .22"></div>
  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative">
    <a href="V5-Rencontrer.dc.html" aria-label="Retour" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="tag" style="flex: 1 1 auto" aria-label="Étape 3 sur 8 : Tu cherches"><b>3/8</b>Tu cherches<span style="margin-left: auto; width: 70px; height: 6px; border-radius: 999px; background: #EEDFCB; overflow: hidden"><i style="display: block; height: 100%; width: 38%; background: #D93A1C"></i></span></span>
  </div>
  <h1 class="d pop" style="animation-delay: .06s; margin: 16px 0 0; font-size: 46px; position: relative">TU CHERCHES…</h1>
  <div class="pop" role="radiogroup" aria-label="Ce que tu cherches" style="animation-delay: .1s; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; position: relative">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 72px; padding: 10px 14px; border-radius: 22px; border: 0; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; box-shadow: 0 5px 0 {{o.sh}}; font-family: 'Inter', sans-serif">
        <img src="{{o.img}}" alt="" aria-hidden="true" style="width: 50px; height: 50px; object-fit: contain; flex: 0 0 auto">
        <span style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto"><span class="d" style="font-size: 24px">{{o.title}}</span><span style="font-size: 13px; font-weight: 600; line-height: 1.35; color: {{o.sub}}">{{o.sub_t}}</span></span>
        <span style="width: 24px; height: 24px; border-radius: 50%; border: 3px solid {{o.ring}}; box-sizing: border-box; background: {{o.dot}}; flex: 0 0 auto"></span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{plus}}" hint-placeholder-val="{{false}}">
    <div class="card pop" style="margin-top: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; position: relative">
      <span style="font-size: 13px; font-weight: 800">Une histoire plutôt… <span style="font-weight: 600; color: #6F6458">secret</span></span>
      <div style="display: flex; gap: 6px"><sc-for list="{{tons}}" as="p" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" class="pill" style="flex: 1 1 0; background: {{p.bg}}; color: {{p.fg}}; box-shadow: 0 3px 0 #E3D3BE">{{p.t}}</button></sc-for></div>
      <span style="font-size: 13px; font-weight: 800; margin-top: 4px">Des enfants un jour ? <span style="font-weight: 600; color: #6F6458">facultatif · secret</span></span>
      <div style="display: flex; gap: 6px"><sc-for list="{{enfs}}" as="p" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{p.on}}" onClick="{{p.pick}}" class="pill" style="flex: 1 1 0; background: {{p.bg}}; color: {{p.fg}}; box-shadow: 0 3px 0 #E3D3BE">{{p.t}}</button></sc-for></div>
    </div>

  <div class="pop" style="animation-delay: .2s; margin-top: 12px; display: flex; gap: 10px; align-items: center; background: #16110D; color: #fff; border-radius: 18px; padding: 12px 14px; position: relative"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><rect x="5" y="10" width="14" height="10" rx="3" fill="#C8F542"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="#C8F542" stroke-width="2.2" fill="none"/><circle cx="12" cy="15" r="1.6" fill="#16110D"/></svg><span style="font-size: 12px; font-weight: 600; line-height: 1.4"><strong style="color: #C8F542">Personne ne le voit.</strong> Ça sert seulement à composer tes groupes et tes duos.</span></div>

    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><a href="V5-Consentement.dc.html" class="btn b1">Continuer<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a></sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{true}}"><button type="button" class="btn bdis" style="width: 100%" aria-disabled="true">Choisis une réponse</button></sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat": {"editor": "enum", "options": ["vide", "rempli"], "default": "vide", "section": "État"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); const r = (p.etat ?? 'vide') === 'rempli'; this.state = { pick: r ? 'deux' : null, ton: r ? 'verra' : null, enf: r ? 'nsp' : null }; }
  renderVals() {
    const s = this.state;
    const O = [
      { id: 'potes', title: 'Nouveaux potes', sub_t: 'Une bande dans ton quartier.', img: '/_blob/7bbc8c67ffec185c67f57ffbd3d2bb28' },
      { id: 'histoire', title: 'Une histoire', sub_t: 'Seulement si c’est réciproque.', img: '/_blob/1ce3e6d22daeb94d1bcda86bda596745' },
      { id: 'deux', title: 'Les deux', sub_t: 'Des potes, et plus si affinités.', img: '/_blob/720b7f4943a2e2b24c83fb1d80811c8d' }
    ];
    const card = (o, on, f) => ({ ...o, on: on ? 'true' : 'false', bg: on ? '#16110D' : '#fff', fg: on ? '#fff' : '#16110D', sub: on ? '#E3D9CF' : '#5A5047', sh: on ? '#000' : '#EEDFCB', ring: on ? '#C8F542' : '#B9A88F', dot: on ? '#C8F542' : 'transparent', pick: f });
    const pill = (cur, id, t, f) => ({ t, on: cur === id ? 'true' : 'false', bg: cur === id ? '#16110D' : '#fff', fg: cur === id ? '#fff' : '#16110D', pick: f });
    const plus = s.pick === 'histoire' || s.pick === 'deux';
    return {
      opts: O.map((o) => card(o, s.pick === o.id, () => this.setState({ pick: o.id }))),
      plus, ready: !!s.pick, notReady: !s.pick,
      tons: [['serieuse', 'Sérieuse'], ['verra', 'On verra']].map(([id, t]) => pill(s.ton, id, t, () => this.setState({ ton: id }))),
      enfs: [['oui', 'Oui'], ['non', 'Non'], ['nsp', 'Je ne sais pas']].map(([id, t]) => pill(s.enf, id, t, () => this.setState({ enf: id })))
    };
  }
}
</script>
