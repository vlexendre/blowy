<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pause — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6F6458}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#D93A1C;color:#fff;box-shadow:0 5px 0 #9E2510}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.b3{background:#fff;color:#16110D;box-shadow:0 5px 0 #E8D9C4}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.bdis{background:#E9DFD1;color:#5A5047;box-shadow:none;cursor:not-allowed}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:#5A5047;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.07)}
.tag b{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#16110D;color:#C8F542;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;cursor:pointer}
.icb{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:0;cursor:pointer}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.grp{background:#fff;border-radius:20px;box-shadow:0 4px 0 #EEDFCB;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;font-size:14px;font-weight:700;border-top:1px solid #F4EADC;box-sizing:border-box}
.row:first-child{border-top:0}
.val{margin-left:auto;font-size:12px;font-weight:600;color:#6F6458;text-align:right}
.ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cap{display:inline-block;background:#16110D;color:#fff;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600}
.them{align-self:flex-start;max-width:270px;background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #EEDFCB}
.me{align-self:flex-end;max-width:270px;background:linear-gradient(135deg,#C2185B,#C4341B);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #8E1B10}
.sw{margin-left:auto;width:54px;height:44px;border:0;cursor:pointer;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sw i{width:50px;height:30px;border-radius:999px;padding:3px;box-sizing:border-box;display:flex}
.sw i b{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.pill{min-height:44px;min-width:44px;padding:0 12px;border-radius:14px;border:0;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;font-weight:800;white-space:nowrap}
.gnav{position:absolute;left:14px;right:14px;bottom:18px;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px;border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.8));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 16px 36px rgba(22,17,13,.24),0 2px 6px rgba(22,17,13,.08);overflow:hidden}
.gnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:28px;font-family:'Inter',sans-serif;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#4E453C}
.gnav a.on{color:#16110D;background:linear-gradient(180deg,rgba(214,250,110,.95),rgba(200,245,66,.85))}
.gnav .bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#C2185B;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ring{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.r1{animation:ring 2.4s ease-out infinite}.r2{animation:ring 2.4s ease-out .8s infinite}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
.sk{background:linear-gradient(90deg,#F2E6D6 0,#FBF3E8 60px,#F2E6D6 120px);background-size:400px 100%;animation:shimmer 1.4s linear infinite;border-radius:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; padding: 52px 20px 22px; position: relative">
  <div style="display: flex; align-items: center; gap: 10px; position: relative">
    <a href="V5-Accueil.dc.html" aria-label="Retour" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="d" style="margin: 0; font-size: 40px; white-space: nowrap; flex: 1 1 auto; min-width: 0">PAUSE</h1>
  </div>
  <img src="/_blob/4e3a02633d0d3eb2833939785019cfc8" alt="" aria-hidden="true" style="margin-top: 10px; width: 120px; height: 120px; object-fit: contain">
  <h2 class="d" style="margin: 4px 0 0; font-size: 32px; line-height: .95">Une pause, sans rien perdre.</h2>
  <p style="margin: 8px 0 0; font-size: 14px; font-weight: 600; line-height: 1.45; color: #5A5047">Aucune proposition, aucune notification. Ta bande et tes duos restent là. Ta sortie du jeu. 12 nov. reste prévue : tu peux l’annuler gratuitement jusqu’au mer. 11 nov. 18 h.</p>
  <div role="radiogroup" aria-label="Durée" style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ds}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 56px; border-radius: 18px; border: 0; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; box-shadow: 0 4px 0 #EEDFCB; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800">{{o.t}}</button></sc-for>
  </div>
  <div style="margin-top: auto">
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><a href="V5-Accueil.dc.html" class="btn b2">Mettre en pause</a></sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{true}}"><button type="button" class="btn bdis" style="width: 100%" aria-disabled="true">Choisis une durée</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: null }; }
  renderVals() {
    const D = [['1', '1 semaine'], ['2', '2 semaines'], ['x', 'Jusqu’à ce que je revienne']];
    return { ds: D.map(([id, t]) => ({ t, on: this.state.d === id ? 'true' : 'false', bg: this.state.d === id ? '#16110D' : '#fff', fg: this.state.d === id ? '#fff' : '#16110D', pick: () => this.setState({ d: id }) })), ready: !!this.state.d, notReady: !this.state.d };
  }
}
</script>
</body>
</html>
