<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Après la sortie — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8A7E70}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.b3{background:#fff;color:#16110D;box-shadow:0 5px 0 #E8D9C4}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.07)}
.tag b{width:22px;height:22px;border-radius:50%;background:#16110D;color:#C8F542;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.grp{background:#fff;border-radius:20px;box-shadow:0 4px 0 #EEDFCB;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;font-size:14px;font-weight:700;white-space:nowrap;border-top:1px solid #F4EADC}
.row:first-child{border-top:0}
.val{margin-left:auto;font-size:12px;font-weight:600;color:#8A7E70}
.ico{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chev{margin-left:6px;flex:0 0 auto}
.cap{display:inline-block;background:#16110D;color:#fff;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.them{align-self:flex-start;max-width:270px;background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #EEDFCB}
.me{align-self:flex-end;max-width:270px;background:linear-gradient(135deg,#FF3D7F,#FF5A3C);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:14px;line-height:1.4;box-shadow:0 3px 0 #C4341B}
.seg{flex:1 1 0;min-height:44px;border-radius:14px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:800;white-space:nowrap}
.gnav{position:absolute;left:14px;right:14px;bottom:18px;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px;border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.34));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -10px 18px rgba(255,255,255,.2),0 16px 36px rgba(22,17,13,.24),0 2px 6px rgba(22,17,13,.08);overflow:hidden}
.gnav::before{content:'';position:absolute;left:22px;right:22px;top:1px;height:44%;border-radius:30px 30px 60% 60%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gnav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:28px;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5E544A;transition:background .3s}
.gnav a.on{color:#16110D;background:linear-gradient(180deg,rgba(214,250,110,.95),rgba(200,245,66,.85));box-shadow:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -2px 4px rgba(125,161,26,.25),0 6px 14px rgba(125,161,26,.35)}
.gnav .bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#FF3D7F;color:#fff;font-size:9px;font-weight:800;letter-spacing:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
.peek{animation:peek 2.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.r1{animation:ring 2.4s ease-out infinite}.r2{animation:ring 2.4s ease-out .8s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes lock{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(0)}}
.lock{animation:lock 2.6s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; padding: 52px 22px 24px; position: relative">
  <div class="blob" style="width: 280px; height: 280px; top: 80px; right: -140px; background: #FF3D7F; opacity: .25"></div>
  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative"><a href="V5-Souvenir.dc.html" aria-label="Retour" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><span class="chip" style="margin-left: auto; background: #16110D; color: #C8F542; font-size: 12px; padding: 6px 12px"><svg class="" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><rect x="5" y="10" width="14" height="10" rx="3" fill="#C8F542"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="#C8F542" stroke-width="2.2" fill="none"/><circle cx="12" cy="15" r="1.6" fill="#16110D"/></svg>Secret · jusqu'à dimanche 21 h 30</span></div>
  <h1 class="d pop" style="animation-delay: .04s; margin: 16px 0 0; font-size: 46px; position: relative">ALORS, JEUDI ?</h1>
  <p class="pop" style="animation-delay: .06s; margin: 6px 0 0; font-size: 13px; font-weight: 600; line-height: 1.45; color: #5A5047; position: relative">Seuls les accords mutuels se révèlent. Personne n'apprend jamais un « non ».</p>
  <sc-if value="{{voting}}" hint-placeholder-val="{{true}}">
    <div style="margin-top: 14px; display: flex; align-items: center; gap: 5px; position: relative"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="height: 8px; width: {{d.w}}; border-radius: 999px; background: {{d.c}}"></span></sc-for><span style="margin-left: auto; font-size: 12px; font-weight: 800; color: #8A7E70">{{step}}</span></div>
    <div class="pop" style="margin-top: 10px; position: relative; height: 270px; border-radius: 26px; overflow: hidden; background: {{g}}; box-shadow: 0 6px 0 rgba(22,17,13,.2)">
      <span class="d" style="position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-size: 120px; color: rgba(255,255,255,.5)">{{ini}}</span>
      <span style="position: absolute; right: 12px; top: 12px; width: 56px; height: 56px; border-radius: 18px; background: #fff; display: flex; align-items: center; justify-content: center"><img src="{{img}}" alt="" aria-hidden="true" style="width: 50px; height: 50px; object-fit: contain"></span>
      <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 16px 14px; background: linear-gradient(180deg, rgba(22,17,13,0), rgba(22,17,13,.7)); color: #fff; display: flex; flex-direction: column; gap: 2px"><span class="d" style="font-size: 30px">{{n}}, {{a}}</span><span style="font-size: 12px; font-weight: 700">et {{pet}}, son pet</span></span>
    </div>
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px; position: relative">
      <button type="button" onClick="{{ami}}" class="btn" style="width: 100%; background: #C8F542; color: #16110D; box-shadow: 0 5px 0 #7DA11A">Ami·e</button>
      <sc-if value="{{plus}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{plusV}}" class="btn" style="width: 100%; background: #FF3D7F; color: #fff; box-shadow: 0 5px 0 #B81F55">Plus</button></sc-if>
      <button type="button" onClick="{{non}}" class="btn b3" style="width: 100%">Non</button>
    </div>
  </sc-if>
  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center">
      <img src="/_blob/630cf503134679d62afe62d88edbda8d" alt="Nino garde le secret" class="sq" style="width: 150px; height: 150px; object-fit: contain">
      <h2 class="d" style="margin: 0; font-size: 36px">C'EST ENVOYÉ.</h2>
      <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.5; color: #5A5047; max-width: 300px">Nino te dit tout dès que les autres ont voté, ou dimanche 21 h 30 au plus tard.</p>
    </div>
    <a href="V5-Apres-resultats.dc.html" class="btn b1">Voir les accords<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0, votes: [] }; }
  renderVals() {
    const P = [
      { n: 'Léa', a: '27', pet: 'Suzie', g: 'linear-gradient(160deg, #F3C7B2, #D9897A)', img: '/_blob/bbb22b42d36399583200635059710253', plus: true },
      { n: 'Malo', a: '29', pet: 'Gaston', g: 'linear-gradient(160deg, #C9B38F, #8C6A44)', img: '/_blob/e10a7fce2dc7e3ce8d3382f9d3069bc8', plus: false },
      { n: 'Sarah', a: '26', pet: 'Pia', g: 'linear-gradient(160deg, #B9D3F0, #7C93C9)', img: '/_blob/8a35794ced023a499838ce341afd6ac4', plus: true }
    ];
    const s = this.state, done = s.i >= P.length, cur = P[Math.min(s.i, P.length - 1)];
    const vote = (v) => () => this.setState({ i: s.i + 1, votes: s.votes.concat([v]) });
    return {
      done, voting: !done, n: cur.n, a: cur.a, pet: cur.pet, g: cur.g, img: cur.img, ini: cur.n[0], plus: cur.plus,
      step: Math.min(s.i + 1, 3) + ' / 3',
      dots: P.map((x, i) => ({ c: i < s.i ? '#16110D' : (i === s.i ? '#FF5A3C' : '#EEDFCB'), w: i === s.i ? '22px' : '8px' })),
      ami: vote('ami'), plusV: vote('plus'), non: vote('non')
    };
  }
}
</script>
</body>
