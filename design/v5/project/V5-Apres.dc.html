<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { v: { lea: 'non', malo: 'non', sarah: 'non' } }; }
  renderVals() {
    const P = [['lea', 'Léa', 'linear-gradient(160deg, #F3C7B2, #B9705F)', 'L'], ['malo', 'Malo', 'linear-gradient(160deg, #C9B38F, #6E5133)', 'M'], ['sarah', 'Sarah', 'linear-gradient(160deg, #B9D3F0, #5E77B0)', 'S']];
    const O = [['ami', 'Amitié', '#C8F542', '#16110D', 'none'], ['plus', 'Plus', '#C2185B', '#fff', 'none'], ['non', 'Non', '#fff', '#16110D', 'inset 0 0 0 2.5px #16110D']];
    return {
      rows: P.map(([id, n, g, i]) => ({ n, g, i, opts: O.map(([o, t, bg, fg, onsh]) => { const on = this.state.v[id] === o; return { t, on: on ? 'true' : 'false', bg: on ? bg : '#fff', fg: on ? fg : '#16110D', sh: on ? onsh : '0 3px 0 #E3D3BE', pick: () => this.setState({ v: { ...this.state.v, [id]: o } }) }; }) }))
    };
  }
}
