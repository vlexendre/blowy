<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ami ou plus — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.07)}
.tag b{width:22px;height:22px;border-radius:50%;background:#16110D;color:#C8F542;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .65s cubic-bezier(.2,1.2,.3,1) both}
@keyframes lock{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(0)}}
.lock{animation:lock 2.6s ease-in-out infinite}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.2s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; padding: 56px 22px 26px; position: relative">
  <div class="blob" style="width: 300px; height: 300px; top: 300px; left: -170px; background: #FF3D7F; opacity: .3"></div>
  <div class="blob" style="width: 260px; height: 260px; top: 80px; right: -150px; background: #C8F542; opacity: .45"></div>

  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative">
    <a href="V4-Vie.dc.html" aria-label="Retour" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="tag" style="flex: 1 1 auto"><b>03</b>Entre nous<span style="margin-left: auto; width: 70px; height: 6px; border-radius: 999px; background: #EEDFCB; overflow: hidden"><i style="display: block; height: 100%; width: 57%; background: #FF5A3C"></i></span></span>
    <span class="chip" style="background: #16110D; color: #C8F542">+80 XP</span>
  </div>

  <h1 class="d pop" style="animation-delay: .06s; margin: 18px 0 0; font-size: 46px; white-space: nowrap; position: relative">TU CHERCHES…</h1>

  <div class="pop" style="animation-delay: .12s; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; position: relative">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button type="button" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 90px; padding: 10px 14px; border-radius: 22px; border: 0; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; box-shadow: 0 5px 0 {{o.sh}}; font-family: 'Inter', sans-serif; transform: {{o.tf}}">
        <img src="{{o.img}}" alt="" aria-hidden="true" class="{{o.cls}}" style="width: 66px; height: 66px; object-fit: contain; flex: 0 0 auto">
        <span style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto">
          <span class="d" style="font-size: 26px; white-space: nowrap">{{o.title}}</span>
          <span style="font-size: 12px; font-weight: 500; line-height: 1.35; opacity: .85">{{o.sub}}</span>
        </span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{isAmi}}" hint-placeholder-val="{{false}}">
    <div class="pop" style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #F2E6D6; border-radius: 18px; padding: 4px; position: relative">
      <sc-for list="{{many}}" as="m" hint-placeholder-count="2"><button type="button" onClick="{{m.pick}}" style="min-height: 52px; border-radius: 14px; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: 'Inter', sans-serif; background: {{m.bg}}; color: #16110D; box-shadow: {{m.sh}}"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800">{{m.t}}</span><span style="font-size: 11px; font-weight: 600; color: #6B6259">{{m.s}}</span></button></sc-for>
    </div>
  </sc-if>
  <div class="pop" style="animation-delay: .2s; margin-top: 12px; display: flex; gap: 10px; align-items: center; background: #16110D; color: #fff; border-radius: 18px; padding: 12px 14px; position: relative">
    <svg class="lock" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><rect x="5" y="10" width="14" height="10" rx="3" fill="#C8F542"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="#C8F542" stroke-width="2.2" fill="none"/><circle cx="12" cy="15" r="1.6" fill="#16110D"/></svg>
    <span style="font-size: 12px; font-weight: 500; line-height: 1.4"><strong style="color: #C8F542">Secret.</strong> L'autre ne le saura que si vous avez choisi pareil. Sinon : branche Ami, personne n'est rejeté.</span>
  </div>

  <div class="pop" style="animation-delay: .26s; margin-top: 12px; display: flex; gap: 6px; position: relative">
    <span class="chip" style="background: #fff; box-shadow: 0 2px 0 #EEDFCB">24 – 34 ans</span>
    <span class="chip" style="background: #fff; box-shadow: 0 2px 0 #EEDFCB">Paris · 8 km</span>
    <span class="chip" style="background: #fff; box-shadow: 0 2px 0 #EEDFCB">Tous genres</span>
  </div>

  <a href="V4-Eclosion.dc.html" class="btn b1 pop" style="animation-delay: .32s; margin-top: auto; position: relative">Continuer<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'plus', many: 1 }; }
  renderVals() {
    const B = '/_blob/';
    const O = [
      { id: 'ami', title: 'DES AMI·ES', sub: 'Un·e ou plusieurs. Ta bande peut s’agrandir.', img: B + '7bbc8c67ffec185c67f57ffbd3d2bb28', on: ['#C8F542', '#16110D', '#16110D'] },
      { id: 'plus', title: 'PLUS, SI AFFINITÉS', sub: 'Les visages se révèlent avec le lien.', img: B + '1ce3e6d22daeb94d1bcda86bda596745', on: ['#FF3D7F', '#fff', '#B81F55'] },
      { id: 'open', title: 'JE LAISSE VENIR', sub: 'Vous décidez au niveau 3.', img: B + '630cf503134679d62afe62d88edbda8d', on: ['#16110D', '#fff', '#000'] }
    ];
    const opts = O.map((o) => { const on = this.state.pick === o.id; return { ...o, cls: on ? 'sq' : '', bg: on ? o.on[0] : '#fff', fg: on ? o.on[1] : '#16110D', sh: on ? o.on[2] : '#EEDFCB', tf: on ? 'translateY(-2px)' : 'none', pick: () => this.setState({ pick: o.id }) }; });
    const M = [['Un·e ami·e', 'en duo'], ['Plusieurs', 'une bande de 3 à 5 pets']];
    return { opts, isAmi: this.state.pick === 'ami', many: M.map(([t, s], i) => ({ t, s, bg: this.state.many === i ? '#fff' : 'transparent', sh: this.state.many === i ? '0 3px 0 #E3D3BE' : 'none', pick: () => this.setState({ many: i }) })) };
  }
}
</script>
</body>
</html>
