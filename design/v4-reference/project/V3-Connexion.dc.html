<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion — claude.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#fff}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: linear-gradient(170deg, #FF5A3C 0%, #FF3D7F 55%, #7C3AED 130%); padding: 52px 20px 26px">

  <div class="blob dr" style="width: 300px; height: 300px; top: 200px; right: -150px; background: #FFE36E; opacity: .5"></div>
  <div class="pop" style="display: flex; align-items: center; justify-content: space-between; position: relative"><a href="V3-Welcome.dc.html" aria-label="Retour" class="back" style="background: rgba(255,255,255,.18)"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><span class="d" style="font-size: 26px">claude<span style="color: #16110D">.</span></span><span style="width: 40px"></span></div>
  <div class="pop" style="animation-delay: .06s; margin-top: 18px; height: 230px; display: flex; align-items: center; justify-content: center; position: relative">
    <span class="glow" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 70%)"></span>
    <img src="{{img}}" alt="{{alt}}" class="{{cls}}" style="position: relative; width: 210px; height: 210px; object-fit: contain">
  </div>
  <h1 class="d pop" style="animation-delay: .1s; margin: 6px 0 0; font-size: 41px; white-space: nowrap; position: relative">{{title}}</h1>
  <p class="pop" style="animation-delay: .14s; margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.45; color: #FFE3EC; position: relative">{{sub}}</p>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative">
    <sc-if value="{{choose}}" hint-placeholder-val="{{true}}">
      <button type="button" class="btn b2" onClick="{{sms}}"><svg width="18" height="20" viewBox="0 0 18 22" aria-hidden="true"><path d="M14.6 11.7c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C4 5.9 2.3 7 1.4 8.6c-1.9 3.3-.5 8.1 1.3 10.8.9 1.3 1.9 2.7 3.3 2.6 1.3-.1 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.8-1.1-2.8-4.6zM12 4c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3-1.5z" fill="#fff"/></svg>Continuer avec Apple</button>
      <button type="button" class="btn" onClick="{{sms}}" style="background: #fff; color: #16110D; box-shadow: 0 5px 0 #C4341B"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"/><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z" fill="#EA4335"/></svg>Continuer avec Google</button>
      <button type="button" class="ghost" onClick="{{sms}}" style="color: #fff">Par SMS · +33 6 •• •• 12 48</button>
    </sc-if>
    <sc-if value="{{coding}}" hint-placeholder-val="{{false}}">
      <span class="lbl" style="color: #FFE3EC">Code reçu par SMS</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{digits}}" as="g" hint-placeholder-count="6"><span class="d" style="height: 58px; border-radius: 14px; background: {{g.bg}}; color: #16110D; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 0 rgba(22,17,13,.25)">{{g.v}}</span></sc-for>
      </div>
      <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><a href="V3-Nid.dc.html" class="btn bl bounce" style="margin-top: 6px">Retrouver Claude</a></sc-if>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 0, n: 0 }; }
  renderVals() {
    const s = this.state, code = '481 207'.replace(' ', '');
    const sms = () => { if (s.step) return; this.setState({ step: 1 }); let k = 0; const t = setInterval(() => { k++; this.setState({ n: k }); if (k >= 6) clearInterval(t); }, 260); };
    const ready = s.n >= 6;
    return {
      choose: s.step === 0, coding: s.step === 1, sms, ready,
      digits: code.split('').map((v, i) => ({ v: i < s.n ? v : '', bg: i < s.n ? '#C8F542' : 'rgba(255,255,255,.9)' })),
      img: ready ? '/_blob/76e13d29027c25245f735f122d3f7eda' : '/_blob/5b3fde8a5b399e3d5b437f4745d09971', alt: ready ? 'Claude se réveille, tout content' : 'Claude dort en t’attendant', cls: ready ? 'bounce' : 'sq',
      title: ready ? 'IL T’A RECONNU.' : 'CLAUDE T’ATTENDAIT.',
      sub: ready ? 'Série de 8 jours sauvée. Luma a gardé ta place sur le canapé.' : 'Il a gardé ta série au chaud : 8 jours. Reconnecte-toi avant minuit.'
    };
  }
}
</script>
</body>
</html>
