<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sa vision — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FFF7EC; padding: 52px 18px 26px">

  <div class="blob dr" style="width: 260px; height: 260px; top: -90px; right: -100px; background: #FFB347; opacity: .55"></div>
  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative">
    <button type="button" onClick="{{prev}}" aria-label="Retour" class="back" style="border: 0; cursor: pointer; background: #fff; box-shadow: 0 3px 0 #EEDFCB"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="height: 8px; border-radius: 999px; background: {{b.c}}; transition: background .3s"></span></sc-for></div>
    <span class="chip" style="background: #16110D; color: #C8F542">{{stepTxt}}</span>
  </div>

  <!-- live vision card -->
  <div class="pop" style="animation-delay: .04s; margin-top: 14px; border-radius: 24px; background: #16110D; color: #fff; padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 5px 0 #000; position: relative">
    <img src="{{petImg}}" alt="Nino" class="sq" style="width: 72px; height: 72px; object-fit: contain; flex: 0 0 auto">
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 auto">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="d" style="font-size: 20px">Nino · ta vision</span><span style="font-size: 11px; font-weight: 800; color: #C8F542">{{fill}} %</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 5px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="5"><span class="chip" style="background: {{t.bg}}; color: {{t.fg}}; border: {{t.bd}}">{{t.t}}</span></sc-for></div>
    </div>
  </div>

  <h1 class="d pop" style="animation-delay: .08s; margin: 18px 0 0; font-size: 44px; line-height: .92; position: relative">{{q}}</h1>
  <p style="margin: 6px 0 0; font-size: 14px; font-weight: 600; color: #6B6259; position: relative">{{hint}}</p>

  <sc-if value="{{single}}" hint-placeholder-val="{{true}}">
    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <button type="button" onClick="{{o.pick}}" class="pop" style="animation-delay: {{o.dl}}; min-height: 132px; border-radius: 22px; border: 0; cursor: pointer; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -.02em; background: {{o.bg}}; color: {{o.fg}}; box-shadow: 0 5px 0 {{o.sh}}; transform: translateY({{o.ty}}); transition: transform .15s"><img src="{{o.img}}" alt="" aria-hidden="true" style="width: 54px; height: 54px; object-fit: contain">{{o.t}}</button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{multi}}" hint-placeholder-val="{{false}}">
    <div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; position: relative">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="10"><button type="button" onClick="{{c.pick}}" style="min-height: 46px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; background: {{c.bg}}; color: {{c.fg}}; box-shadow: 0 3px 0 {{c.sh}}">{{c.t}}</button></sc-for>
    </div>
  </sc-if>

  <div style="margin-top: auto; position: relative">
    <sc-if value="{{showNext}}" hint-placeholder-val="{{false}}"><button type="button" class="btn b1 bounce" onClick="{{next}}">{{nextTxt}}</button></sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}"><a href="V4-Intention.dc.html" class="btn b1 bounce">C'est sa vision</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 0, a: [null, null, [], null], done: false }; }
  renderVals() {
    const s = this.state, I = {"fleur": "/_blob/a19b0b8ee0743659ab8c9f0963f513c7", "livre": "/_blob/ef1dfc888590a6f0bcaee025aa55d437", "ballon": "/_blob/c33831b226a692fc0a8dd82649163089", "casque": "/_blob/df63957d57e3f5480c282f874f9f0d49", "sac": "/_blob/e68877cdff5027b443148940d70104af", "tasse": "/_blob/cf3f73060c502cc8dbf1ef34785e8aef", "lunettes": "/_blob/0aab81f3b21c416369cdfa4be1f82186", "bonnet": "/_blob/415595cd339741eb78d244ec9c118344", "trophee": "/_blob/3775f1fc3d016b06a0ff209343fdc200", "joy": "/_blob/a34df3bc40d182eda5da48721a461d0f", "idle": "/_blob/630cf503134679d62afe62d88edbda8d"};
    const Q = [
      { q: 'IL IRAIT À L’ÉCOLE…', hint: 'Une seule réponse. Fie-toi à ton instinct.', o: [['Beaux-Arts', 'fleur'], ['Polytechnique', 'livre'], ['École du cirque', 'ballon'], ['Autodidacte', 'casque']] },
      { q: 'SON DIMANCHE IDÉAL ?', hint: 'Celui qu’il passerait avec toi.', o: [['Rando', 'sac'], ['Brunch', 'tasse'], ['Musée', 'lunettes'], ['Grasse mat’', 'bonnet']] },
      { q: 'SES PASSIONS.', hint: '4 maximum. C’est ce qui fait matcher les pets.', m: ['Foot', 'Poterie', 'Concerts', 'Cuisine', 'Jeux vidéo', 'Danse', 'Photo', 'Voyage', 'Lecture', 'Mode'] },
      { q: 'IL NE FERA JAMAIS…', hint: 'Sa limite. Elle est visible par les autres pets.', o: [['Ghoster', 'trophee'], ['Mentir', 'livre'], ['Être en retard', 'tasse'], ['Juger', 'lunettes']] }
    ];
    const cur = Q[s.step], multi = !!cur.m;
    const setA = (v, adv) => { const a = s.a.slice(); a[s.step] = v; this.setState({ a }); if (adv) setTimeout(() => { if (s.step < 3) this.setState({ step: s.step + 1 }); else this.setState({ done: true }); }, 380); };
    const passions = s.a[2];
    const tags = [s.a[0], s.a[1]].concat(passions).concat(s.a[3] ? ['jamais : ' + s.a[3]] : []).filter(Boolean);
    const slots = Math.max(0, 6 - tags.length);
    const total = (s.a[0] ? 1 : 0) + (s.a[1] ? 1 : 0) + Math.min(passions.length, 3) / 3 + (s.a[3] ? 1 : 0);
    return {
      q: cur.q, hint: cur.hint, single: !multi, multi, stepTxt: (s.step + 1) + ' / 4',
      bars: [0, 1, 2, 3].map(i => ({ c: i < s.step || (i === s.step && s.done) ? '#FF5A3C' : (i === s.step ? '#FFB347' : '#F2E6D6') })),
      prev: () => { if (s.step > 0) this.setState({ step: s.step - 1, done: false }); },
      opts: multi ? [] : cur.o.map(([t, ic], i) => { const on = s.a[s.step] === t; return { t, img: I[ic], dl: (i * .04) + 's', pick: () => setA(t, true), bg: on ? '#16110D' : '#fff', fg: on ? '#fff' : '#16110D', sh: on ? '#000' : '#EEDFCB', ty: on ? '-3px' : '0' }; }),
      chips: multi ? cur.m.map(t => { const on = passions.includes(t); return { t, bg: on ? '#C8F542' : '#fff', fg: '#16110D', sh: on ? '#7DA11A' : '#EEDFCB', pick: () => { const p = on ? passions.filter(x => x !== t) : (passions.length < 4 ? passions.concat([t]) : passions); setA(p, false); } }; }) : [],
      showNext: multi && passions.length > 0 && !s.done, nextTxt: passions.length + ' / 4 · continuer', next: () => this.setState({ step: 3 }),
      done: s.done,
      tags: tags.map(t => ({ t, bg: '#2E2620', fg: '#FFB347', bd: '0' })).concat(Array.from({ length: slots }, () => ({ t: '?', bg: 'transparent', fg: '#6B6259', bd: '1.5px dashed #4A3F36' }))),
      fill: Math.round(total / 4 * 100), petImg: s.done ? I.joy : I.idle
    };
  }
}
</script>
</body>
</html>
