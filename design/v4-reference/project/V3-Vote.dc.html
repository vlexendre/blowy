<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tes amis votent — claude.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FFF7EC; padding: 52px 18px 24px">

  <div class="blob" style="width: 260px; height: 260px; top: -90px; right: -90px; background: #22D3EE; opacity: .35"></div>
  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative"><a href="V3-Craft.dc.html" aria-label="Retour au craft" class="back" style="background: #fff; box-shadow: 0 3px 0 #EEDFCB"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div style="flex: 1 1 auto; height: 10px; border-radius: 999px; background: #F2E6D6; overflow: hidden"><div style="width: 22%; height: 100%; background: #FF5A3C; border-radius: 999px"></div></div><span class="chip" style="background: #16110D; color: #C8F542">OPTION</span></div>
  <h1 class="d pop" style="animation-delay: .05s; margin: 18px 0 0; font-size: 50px; white-space: nowrap; position: relative">TES AMIS VOTENT.</h1>
  <p class="pop" style="animation-delay: .1s; margin: 8px 0 0; font-size: 14px; font-weight: 600; line-height: 1.45; color: #5A5047">Ils te connaissent mieux que toi. Ils choisissent les 3 traits de Claude, tu valides.</p>
  <div class="card pop" style="animation-delay: .14s; margin-top: 14px; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 10px">
    <img src="/_blob/46a416be8bb27d10c46153792b6aa5cf" alt="" aria-hidden="true" style="width: 40px; height: 40px; object-fit: contain">
    <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><span class="d" style="font-size: 18px">claude.app/v/alex</span><span style="font-size: 11px; font-weight: 700; color: #8A7E70">Lien valable 24 h · sans compte</span></span>
    <button type="button" onClick="{{copy}}" style="min-height: 42px; padding: 0 14px; border-radius: 14px; border: 0; cursor: pointer; background: {{cpBg}}; color: {{cpFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 #000; white-space: nowrap">{{cpTxt}}</button>
  </div>
  <span class="lbl pop" style="animation-delay: .18s; margin-top: 16px; color: #8A7E70">En direct · {{nVotes}} votes</span>
  <div class="pop" style="animation-delay: .2s; margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 104px; font-size: 14px; font-weight: 800; white-space: nowrap">{{b.t}}</span>
        <div style="flex: 1 1 auto; height: 30px; border-radius: 10px; background: #F2E6D6; overflow: hidden; position: relative"><div style="height: 100%; width: {{b.w}}; background: {{b.c}}; border-radius: 10px; transition: width .6s cubic-bezier(.2,1.2,.3,1)"></div><span style="position: absolute; right: 8px; top: 7px; font-size: 12px; font-weight: 800">{{b.n}}</span></div>
      </div>
    </sc-for>
  </div>
  <div class="pop" style="animation-delay: .24s; margin-top: 14px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
      <div class="bounce" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #5A5047"><span class="d" style="width: 28px; height: 28px; border-radius: 50%; background: {{f.c}}; color: #16110D; display: flex; align-items: center; justify-content: center; font-size: 14px">{{f.i}}</span><span><b style="color: #16110D">{{f.n}}</b> a voté {{f.v}}</span></div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <span class="chip" style="align-self: center; background: #C8F542; font-size: 12px; padding: 7px 12px">{{reward}}</span>
    <a href="V3-Vie.dc.html" class="btn b1">Garder leur choix</a>
    <a href="V3-Craft.dc.html" class="ghost" style="color: #5A5047">Choisir moi-même</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { copied: false, k: 3 }; }
  renderVals() {
    const s = this.state;
    const V = [['Inès', 'I', '#22D3EE', 'Sportif'], ['Tom', 'T', '#FFB347', 'Drôle'], ['Maya', 'M', '#C8F542', 'Gentil'], ['Jules', 'J', '#FF7A9C', 'Sportif'], ['Sarah', 'S', '#A78BFA', 'Gentil'], ['Hugo', 'H', '#7DD8C0', 'Scientifique']];
    const got = V.slice(0, s.k), cnt = {};
    got.forEach(v => cnt[v[3]] = (cnt[v[3]] || 0) + 1);
    const T = [['Sportif', '#FF5A3C'], ['Gentil', '#C8F542'], ['Drôle', '#FFB347'], ['Scientifique', '#22D3EE']];
    const copy = () => { if (s.copied) return; this.setState({ copied: true }); let k = s.k; const t = setInterval(() => { k++; this.setState({ k }); if (k >= 6) clearInterval(t); }, 700); };
    return {
      copy, cpTxt: s.copied ? 'Copié ✓' : 'Copier', cpBg: s.copied ? '#C8F542' : '#16110D', cpFg: s.copied ? '#16110D' : '#fff',
      nVotes: s.k, bars: T.map(([t, c]) => ({ t, c, n: cnt[t] || 0, w: ((cnt[t] || 0) / 3 * 100) + '%' })),
      feed: got.slice(-3).reverse().map(v => ({ n: v[0], i: v[1], c: v[2], v: '« ' + v[3] + ' »' })),
      reward: s.k + ' amis · +' + (s.k * 50) + ' pièces · ils rejoignent ton Quartier'
    };
  }
}
</script>
</body>
</html>
