<!doctype html>

<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FFF7EC; padding: 56px 20px 26px">

  <div class="blob dr" style="width: 260px; height: 260px; top: -80px; right: -100px; background: #FFB347; opacity: .6"></div>
  <div class="pop" style="display: flex; align-items: center; gap: 12px; position: relative"><img src="/_blob/1ac37b10961012498dcb18570be5f2f7" alt="Nino tend son téléphone" class="sq" style="width: 96px; height: 96px; object-fit: contain"><span class="chip" style="background: #16110D; color: #C8F542">Premier rendez-vous lancé</span></div>
  <h1 class="d pop" style="animation-delay: .05s; margin: 14px 0 0; font-size: 52px; line-height: .9; position: relative">SUZIE VA RÉPONDRE.</h1>
  <p class="pop" style="animation-delay: .1s; margin: 10px 0 0; font-size: 15px; font-weight: 600; line-height: 1.45; color: #5A5047; position: relative">Nino ne peut pas te prévenir sans toi. 3 notifs max par jour, jamais après 23 h.</p>
  <div class="pop" style="animation-delay: .16s; margin-top: 18px; display: flex; flex-direction: column; gap: 8px; position: relative">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 20px; padding: 10px 12px; box-shadow: 0 4px 0 #EEDFCB; transform: scale({{n.sc}}); opacity: {{n.op}}">
        <span class="d" style="width: 38px; height: 38px; border-radius: 10px; background: #FF5A3C; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 auto">b.</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; font-weight: 800">blowy. · {{n.t}}</span><span style="font-size: 13px; font-weight: 500; line-height: 1.35; color: #5A5047">{{n.m}}</span></span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; position: relative">
    <button type="button" class="btn b1" onClick="{{ask}}">Me prévenir</button>
    <a href="V4-Nid.dc.html" class="ghost" style="color: #5A5047">Plus tard</a>
  </div>
  <sc-if value="{{dialog}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; background: rgba(22,17,13,.45); display: flex; align-items: center; justify-content: center">
      <div class="bounce" style="width: 270px; border-radius: 16px; background: rgba(242,242,247,.96); color: #000; text-align: center; overflow: hidden; font-family: -apple-system, 'Inter', sans-serif">
        <div style="padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">« blowy. » souhaite vous envoyer des notifications</span><span style="font-size: 13px; color: #3C3C43">Alertes, sons et pastilles.</span></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(60,60,67,.3)"><a href="V4-Nid.dc.html" style="padding: 12px; font-size: 16px; color: #0A84FF; border-right: 1px solid rgba(60,60,67,.3)">Refuser</a><a href="V4-Nid.dc.html" style="padding: 12px; font-size: 16px; font-weight: 700; color: #0A84FF">Autoriser</a></div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dialog: false }; }
  renderVals() {
    const N = [['maintenant', 'Suzie a répondu à Nino : « On se fait une balle ? »'], ['il y a 2 h', 'Gaston attend Nino au parc.'], ['22:41', 'Ta série de 8 jours expire à minuit.']];
    return { notes: N.map(([t, m], i) => ({ t, m, sc: 1 - i * 0.03, op: 1 - i * 0.18 })), dialog: this.state.dialog, ask: () => this.setState({ dialog: true }) };
  }
}
</script>
</body>
