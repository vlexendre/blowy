<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Preuve validée — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:transparent;color:inherit;min-height:44px;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;text-transform:none;box-shadow:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .65s cubic-bezier(.2,1.2,.3,1) both}
@keyframes num{0%{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1)}}
.num{animation:num .8s cubic-bezier(.2,1.3,.3,1) .15s both}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.95,1.08)}50%{transform:translateY(0) scale(1.08,.92)}}
.jump{animation:jump 1.3s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(600deg) scale(1);opacity:0}}
.cf{position:absolute;left:50%;top:330px;width:10px;height:14px;border-radius:3px;animation:burst 1.8s cubic-bezier(.1,.8,.3,1) .4s infinite}
@keyframes chk{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.chk{animation:chk .45s cubic-bezier(.2,1.4,.4,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #FFE36E 0%, #FFB347 55%, #FF7A45 120%); display: flex; flex-direction: column; align-items: center; overflow: hidden; padding: 64px 22px 22px; position: relative">
  <div class="blob" style="width: 300px; height: 300px; top: 80px; left: -150px; background: #fff; opacity: .6"></div>
  <span class="cf" style="--dx:-150px;--dy:-220px;background:#FF3D7F"></span><span class="cf" style="--dx:140px;--dy:-240px;background:#7C3AED;animation-delay:.6s"></span><span class="cf" style="--dx:-180px;--dy:-80px;background:#22D3EE;animation-delay:.8s"></span><span class="cf" style="--dx:170px;--dy:-100px;background:#16110D;animation-delay:.5s"></span><span class="cf" style="--dx:-90px;--dy:-280px;background:#C8F542;animation-delay:.9s;border-radius:50%"></span><span class="cf" style="--dx:70px;--dy:-300px;background:#fff;animation-delay:.7s;border-radius:50%"></span>

  <span class="d num" style="font-size: 120px; color: #fff; text-shadow: 0 8px 0 #C97A12; position: relative; white-space: nowrap">+6 XP</span>
  <img src="/_blob/a34df3bc40d182eda5da48721a461d0f" alt="Nino saute de joie" class="jump pop" style="animation-delay: .2s; margin-top: 4px; width: 200px; height: 200px; object-fit: contain; position: relative">
  <h1 class="d pop" style="animation-delay: .3s; margin: 10px 0 0; font-size: 36px; text-align: center; white-space: nowrap; position: relative">TA COURSE, DIGÉRÉE.</h1>
  <p class="pop" style="animation-delay: .36s; margin: 6px 0 0; font-size: 14px; font-weight: 600; color: #7A3A10; white-space: nowrap; position: relative">L. est prévenue. Si elle poste ce soir : +12 duo.</p>

  <div class="pop" style="animation-delay: .44s; margin-top: 18px; align-self: stretch; background: #fff; border-radius: 22px; padding: 12px 14px; box-shadow: 0 5px 0 #C97A12; display: flex; flex-direction: column; gap: 10px; position: relative">
    <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap"><img src="/_blob/c45fb30245137def689cd259ded2caa6" alt="" aria-hidden="true" style="width: 32px; height: 32px; object-fit: contain"><span class="d" style="font-size: 24px; color: #FF5A3C">8 JOURS</span><span style="font-size: 12px; font-weight: 700; color: #8A7E70">de série · record battu</span></div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 10px; font-weight: 800; color: #8A7E70">{{d.l}}</span><span style="width: 34px; height: 34px; border-radius: 11px; background: {{d.bg}}; box-shadow: 0 3px 0 {{d.sh}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{d.done}}" hint-placeholder-val="{{true}}"><svg class="chk" style="animation-delay: {{d.dl}}" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="#16110D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if></span></div>
      </sc-for>
    </div>
  </div>

  <div class="pop" style="animation-delay: .52s; margin-top: auto; align-self: stretch; display: flex; flex-direction: column; gap: 4px; position: relative">
    <a href="V4-Nid.dc.html" class="btn b2">Continuer</a>
    <a href="V4-Story.dc.html" class="btn bl">Partager ma série</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const L = ['Ve', 'Sa', 'Di', 'Lu', 'Ma', 'Me', 'Je'];
    const week = L.map((l, i) => { const done = i < 7; const today = i === 6; return { l, done, bg: today ? '#C8F542' : '#FFE36E', sh: today ? '#16110D' : '#C97A12', dl: (0.6 + i * 0.08) + 's' }; });
    return { week };
  }
}
</script>
</body>
</html>
