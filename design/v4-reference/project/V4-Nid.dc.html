    const call = () => { const n = s.calls + 1; if (n === 1) this.setState({ calls: n, me: 196, other: 20, flip: -1, img: 'angry', bubble: 'Non. Je suis avec ' + cur.pet + '.', hearts: false }); else this.setState({ calls: n, me: 14, other: 200, flip: 1, img: 'happy', bubble: 'Bon. J’arrive.', hearts: false }); };
    const hug = () => this.setState({ me: 86, other: 160, flip: 1, img: 'love', bubble: '+4 XP · câlin à deux', hearts: true });
    const play = () => this.setState({ me: 110, other: 208, img: 'sporty', bubble: 'À moi la balle !', hearts: false, ball: 290, flip: 1 });
    return {
      rdvs, call, hug, play, who: cur.who, place: cur.place, bg: cur.bg, soloOp: s.hearts ? 0 : 1, guest: 'Nino & ' + cur.pet + ' (' + cur.who + ')', moving: s.moving !== null, movPet: s.moving !== null ? R[s.moving].pet.toUpperCase() : '', movPlace: s.moving !== null ? R[s.moving].place : '', movImg: s.moving !== null ? R[s.moving].img : '', movLeft: cur.pet, lienTxt: cur.lvl, lienW: cur.w, chatSub: cur.chat, wallA: cur.wallA, wallB: cur.wallB,
      meLeft: s.me + 'px', otherLeft: s.other + 'px', ballLeft: s.ball + 'px', meFlip: s.flip,
      meImg: B + ME[s.img], meAlt: 'Ton Nino, humeur ' + s.img, otherImg: cur.img, otherAlt: cur.pet + ', le pet de ' + cur.who,
      hasBubble: !!s.bubble, bubble: s.bubble, hearts: s.hearts
    };
  }
}
