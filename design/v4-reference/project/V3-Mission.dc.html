<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sa mission — claude.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.07)}
.tag b{width:22px;height:22px;border-radius:50%;background:#16110D;color:#C8F542;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.cap{display:inline-block;background:#16110D;color:#fff;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .65s cubic-bezier(.2,1.2,.3,1) both}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-3px)}}
.wob{animation:wob 1.6s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; padding: 56px 22px 26px; position: relative">
  <div class="blob" style="width: 300px; height: 300px; top: 200px; right: -170px; background: #FF3D7F; opacity: .3"></div>

  <div class="pop" style="display: flex; align-items: center; gap: 10px; position: relative">
    <a href="V3-Vie.dc.html" aria-label="Retour" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <span class="tag" style="flex: 1 1 auto"><b>03</b>Sa mission<span style="margin-left: auto; width: 70px; height: 6px; border-radius: 999px; background: #EEDFCB; overflow: hidden"><i style="display: block; height: 100%; width: 42%; background: #FF5A3C"></i></span></span>
    <span class="chip" style="background: #16110D; color: #C8F542">+60 XP</span>
  </div>

  <h1 class="d pop" style="animation-delay: .06s; margin: 18px 0 0; font-size: 46px; white-space: nowrap; position: relative">CE QUI LE NOURRIT</h1>
  <p class="pop" style="animation-delay: .1s; margin: 8px 0 0; font-size: 14px; font-weight: 500; line-height: 1.45; color: #5A5047; position: relative">Une preuve photo, en vrai, chaque jour de mission. Ta séance, ton assiette, ton dessin.</p>

  <div class="pop" style="animation-delay: .16s; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; position: relative">
    <sc-for list="{{missions}}" as="m" hint-placeholder-count="5">
      <button type="button" onClick="{{m.pick}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 9px 12px; border-radius: 18px; border: 0; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}; box-shadow: 0 4px 0 {{m.sh}}; font-family: 'Inter', sans-serif; white-space: nowrap">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: {{m.tint}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><img src="{{m.img}}" alt="" aria-hidden="true" class="{{m.cls}}" style="width: 32px; height: 32px; object-fit: contain"></span>
        <span style="display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; min-width: 0"><span class="d" style="font-size: 21px">{{m.title}}</span><span style="font-size: 12px; font-weight: 500; opacity: .75; overflow: hidden; text-overflow: ellipsis">Preuve : {{m.proof}}</span></span>
      </button>
    </sc-for>
  </div>

  <div class="pop" style="animation-delay: .24s; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; position: relative">
    <span style="font-size: 14px; font-weight: 700; white-space: nowrap">Fois par semaine</span>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{freqs}}" as="f" hint-placeholder-count="3">
        <button type="button" onClick="{{f.pick}}" class="d" style="width: 52px; height: 44px; border-radius: 14px; border: 0; cursor: pointer; font-size: 20px; background: {{f.bg}}; color: {{f.fg}}; box-shadow: 0 4px 0 {{f.sh}}">{{f.n}}×</button>
      </sc-for>
    </div>
  </div>

  <div class="pop" style="animation-delay: .3s; margin-top: auto; display: flex; flex-direction: column; gap: 12px; position: relative">
    <div style="display: flex; align-items: center; gap: 8px"><img src="/_blob/c91c8c3f296cbc58c5cd2db9416b08cf" alt="" aria-hidden="true" style="width: 42px; height: 42px; object-fit: contain"><span class="cap">Ton match aura la même. Tenez-la à deux.</span></div>
    <a href="V3-Intention.dc.html" class="btn b1">Continuer<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { m: 'move', f: 3 }; }
  renderVals() {
    const B = '/_blob/';
    const M = [
      { id: 'move', title: 'Bouger', proof: 'ta course, ta séance, ta rando', img: B + '41623539ac72618ce178e12d96d42211', tint: '#FFE3D9' },
      { id: 'eat', title: 'Bien manger', proof: 'ton assiette faite maison', img: B + 'ba10d9997c04264dbff442bf54cc9df0', tint: '#FFF1C9' },
      { id: 'create', title: 'Créer', proof: 'ce que tu as fait de tes mains', img: B + '1defd4a1483a03db93fc96c7d6adad94', tint: '#EDE4FF' },
      { id: 'out', title: 'Sortir', proof: 'un lieu où tu n’étais jamais allé·e', img: B + '92e082a43a23459b7018b72bf04e84e2', tint: '#E8F9C8' },
      { id: 'calm', title: 'Ralentir', proof: 'ta page lue, ton coucher de soleil', img: B + '5f8b45fc3a09ad6c22570f67636d092f', tint: '#E3ECFF' }
    ];
    const missions = M.map((m) => { const on = this.state.m === m.id; return { ...m, cls: on ? 'wob' : '', bg: on ? '#16110D' : '#fff', fg: on ? '#fff' : '#16110D', sh: on ? '#000' : '#EEDFCB', pick: () => this.setState({ m: m.id }) }; });
    const freqs = [2, 3, 5].map((n) => { const on = this.state.f === n; return { n, bg: on ? '#C8F542' : '#fff', fg: '#16110D', sh: on ? '#16110D' : '#EEDFCB', pick: () => this.setState({ f: n }) }; });
    return { missions, freqs };
  }
}
</script>
</body>
</html>
