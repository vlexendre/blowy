<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}

@keyframes pop{0%{transform:translateX(-14px);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop .45s cubic-bezier(.2,1.2,.3,1) both}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(6deg)}40%{transform:rotate(0)}}

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; padding: 52px 16px 20px; position: relative">

  <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px">
