<script type="text/x-dc" data-dc-script data-props='{"online":{"editor":"int","default":3143,"min":0,"max":999999,"section":"Démo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; }
  componentDidMount() { const T = this.props.online ?? 3143, s = Date.now(); this.t = setInterval(() => { const k = Math.min(1, (Date.now() - s) / 1300); this.setState({ n: Math.round(T * (1 - Math.pow(1 - k, 3))) }); if (k >= 1) clearInterval(this.t); }, 30); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() { return { online: this.state.n.toLocaleString('fr-FR') }; }
}
