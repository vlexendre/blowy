<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Classement des pets — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9A8E80}
.nav a.on{color:#16110D}
.nav a.on span{background:#C8F542}
.nav span{width:42px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rise{from{transform:scaleY(0)}}
.rise{animation:rise .8s cubic-bezier(.2,1.2,.3,1) both;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2s ease-in-out infinite}
@keyframes crown{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(8deg) translateY(-4px)}}
.crown{animation:crown 1.8s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="position: relative; overflow: hidden; background: linear-gradient(170deg, #FF3D7F 0%, #FF5A3C 55%, #FFB347 120%); padding: 52px 16px 0; border-radius: 0 0 30px 30px; box-shadow: 0 5px 0 #C4341B">
    <div class="blob" style="width: 220px; height: 220px; top: -60px; right: -60px; background: #FFE36E; opacity: .7"></div>
    <div class="pop" style="display: flex; align-items: center; justify-content: space-between; color: #fff; position: relative">
      <div style="display: flex; align-items: center; gap: 10px"><a href="V4-Nid.dc.html" aria-label="Retour au nid" style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .9">Semaine 44</span><span class="d" style="font-size: 36px; white-space: nowrap">LIGUE CORAIL</span></div></div>
      <span class="chip" style="background: #16110D; color: #C8F542">Fin dans 2j 14h</span>
    </div>
    <div class="pop" style="animation-delay: .06s; margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; position: relative">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" onClick="{{t.pick}}" style="min-height: 34px; border-radius: 12px; border: 0; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 800; background: {{t.bg}}; color: {{t.fg}}">{{t.l}}</button></sc-for>
    </div>
    <!-- Podium -->
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 6px; position: relative">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; align-items: center">
          <sc-if value="{{p.first}}" hint-placeholder-val="{{false}}"><img src="/_blob/fe9020e943658648906f4aa1f8e4ff85" alt="" aria-hidden="true" class="crown" style="width: 34px; height: 34px; object-fit: contain; margin-bottom: -6px"></sc-if>
          <span style="display: flex; align-items: flex-end"><img src="{{p.img}}" alt="{{p.name}}" class="bob" style="width: {{p.size}}; height: {{p.size}}; object-fit: contain; animation-delay: {{p.dl}}"><img src="{{p.img2}}" alt="" aria-hidden="true" class="bob" style="width: 34px; height: 34px; object-fit: contain; margin-left: -12px; transform: scaleX(-1); animation-delay: .6s"></span>
          <span class="d" style="font-size: 13px; color: #fff; white-space: nowrap">{{p.name}}</span>
          <span style="font-size: 10px; font-weight: 700; color: #FFE9D9; white-space: nowrap">{{p.duo}}</span>
          <div class="rise" style="margin-top: 4px; width: 100%; height: {{p.h}}; border-radius: 14px 14px 0 0; background: {{p.col}}; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; box-sizing: border-box"><span class="d" style="font-size: 26px; color: #16110D">{{p.rank}}</span></div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 10px 14px 0; display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-height: 0; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="{{r.href}}" class="pop" style="animation-delay: {{r.dl}}; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 16px; background: {{r.bg}}; color: {{r.fg}}; box-shadow: 0 3px 0 {{r.sh}}; white-space: nowrap">
        <span class="d" style="width: 22px; font-size: 18px; text-align: center">{{r.rank}}</span>
        <span style="display: flex; align-items: flex-end"><img src="{{r.img}}" alt="" aria-hidden="true" style="width: 34px; height: 34px; object-fit: contain"><img src="{{r.img2}}" alt="" aria-hidden="true" style="width: 28px; height: 28px; object-fit: contain; margin-left: -10px; transform: scaleX(-1)"></span>
        <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><span style="font-size: 14px; font-weight: 800">{{r.name}}</span><span style="font-size: 11px; font-weight: 600; opacity: .7">{{r.duo}}</span></span>
        <span class="d" style="font-size: 16px">{{r.xp}} XP</span>
      </a>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 8px; margin: 2px 0; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #7DA11A; white-space: nowrap"><span style="flex: 1; height: 2px; background: #C8F542"></span>Top 7 → Ligue Mangue<span style="flex: 1; height: 2px; background: #C8F542"></span></div>
  </div>
</div>
</x-dc>
