<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box}
.btn:active{transform:translateY(4px);box-shadow:none}
.back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #EEDFCB;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
@keyframes pop{0%{transform:translateY(14px) scale(.96);opacity:0}60%{transform:translateY(-2px) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes shield{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1)}}
.shield{animation:shield .6s cubic-bezier(.2,1.3,.3,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden; padding: 52px 18px 24px; position: relative">

  <sc-if value="{{form}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="V4-Chat.dc.html" aria-label="Retour au chat" class="back"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#16110D" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1 class="d" style="margin: 0; font-size: 34px; white-space: nowrap">SIGNALER L.</h1>
    </div>
    <p class="pop" style="margin: 12px 0 0; font-size: 14px; font-weight: 500; line-height: 1.45; color: #5A5047">C'est confidentiel. L. ne saura pas que c'est toi. Notre équipe répond en moins de 24 h.</p>

    <div class="pop" style="animation-delay: .06s; margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
        <button type="button" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 50px; padding: 0 14px; border-radius: 16px; border: 0; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; background: {{r.bg}}; color: {{r.fg}}; box-shadow: 0 3px 0 {{r.sh}}; white-space: nowrap">
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 3px solid {{r.ring}}; box-sizing: border-box; background: {{r.dot}}; flex: 0 0 auto"></span>{{r.l}}
        </button>
      </sc-for>
    </div>

    <label class="pop" style="animation-delay: .12s; margin-top: 12px; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 3px 0 #EEDFCB; cursor: pointer">
      <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #D92D2D; margin: 0">
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800">Bloquer L. aussi</span><span style="font-size: 12px; font-weight: 500; color: #6B6259">Elle ne pourra plus te contacter.</span></span>
    </label>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; color: #6B6259; text-align: center">En danger immédiat ? Appelle le 17 ou le 112.</span>
      <button type="button" onClick="{{submit}}" class="btn" style="background: #D92D2D; color: #fff; box-shadow: 0 5px 0 #8F1B1B">Envoyer le signalement</button>
    </div>
  </sc-if>

  <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
      <span class="shield" style="width: 110px; height: 110px; border-radius: 36px; background: #C8F542; box-shadow: 0 6px 0 #16110D; display: flex; align-items: center; justify-content: center"><svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z" fill="#16110D"/><path d="M8.5 12l2.4 2.4L15.5 9.8" stroke="#C8F542" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h2 class="d pop" style="margin: 0; font-size: 40px">C'EST ENVOYÉ.</h2>
      <p class="pop" style="animation-delay: .1s; margin: 0; font-size: 14px; font-weight: 500; line-height: 1.5; color: #5A5047; max-width: 300px">L. est bloquée. Tu as bien fait. Nino reste avec toi, avec tout ce qu'il a appris.</p>
      <img src="/_blob/1ce3e6d22daeb94d1bcda86bda596745" alt="Nino te fait un câlin" class="pop" style="animation-delay: .2s; width: 140px; height: 140px; object-fit: contain">
    </div>
    <a href="V4-Vide.dc.html" class="btn pop" style="animation-delay: .3s; background: #16110D; color: #fff; box-shadow: 0 5px 0 #000">Continuer</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { r: 1, sent: false }; }
  renderVals() {
    const L = ['Faux profil', 'Messages déplacés', 'Harcèlement', 'Demande d’argent', 'Autre chose'];
    const reasons = L.map((l, i) => { const on = this.state.r === i; return { l, bg: on ? '#16110D' : '#fff', fg: on ? '#fff' : '#16110D', sh: on ? '#000' : '#EEDFCB', ring: on ? '#FF5A3C' : '#D8C8B2', dot: on ? '#FF5A3C' : 'transparent', pick: () => this.setState({ r: i }) }; });
    return { reasons, form: !this.state.sent, sent: this.state.sent, submit: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
