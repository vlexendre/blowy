<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ligue des quartiers — claude.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:18px;border:0;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;width:100%}
.btn:active{transform:translateY(4px);box-shadow:none}
.b1{background:#FF5A3C;color:#fff;box-shadow:0 5px 0 #C4341B}
.b2{background:#16110D;color:#fff;box-shadow:0 5px 0 #000}
.bl{background:#C8F542;color:#16110D;box-shadow:0 5px 0 #16110D}
.ghost{min-height:44px;border:0;background:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:inherit;display:flex;align-items:center;justify-content:center;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 0 #EEDFCB;color:#16110D}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2.4s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
.sq2{animation:sq 2.8s cubic-bezier(.3,0,.2,1) -1.1s infinite;transform-origin:50% 100%}
@keyframes wob{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(7deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(0)}}
.wob{animation:wob 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes bounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.bounce{animation:bounce .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-30px) scale(1.15)}}
.dr{animation:drift 10s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,66,.7)}70%{box-shadow:0 0 0 10px rgba(200,245,66,0)}}
.pulse{animation:pulse 1.8s infinite}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FFF7EC">

  <div style="padding: 52px 16px 16px; background: linear-gradient(170deg, #22D3EE 0%, #7C3AED 90%); color: #fff; border-radius: 0 0 30px 30px; box-shadow: 0 5px 0 #4C1D95; position: relative; overflow: hidden">
    <div class="blob" style="width: 220px; height: 220px; top: -70px; right: -60px; background: #C8F542; opacity: .55"></div>
    <div class="pop" style="display: flex; align-items: center; justify-content: space-between; position: relative"><a href="V3-Classement.dc.html" aria-label="Retour à la ligue des pets" class="back" style="background: rgba(255,255,255,.18)"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><span class="chip" style="background: #16110D; color: #C8F542">Fin dimanche 23:59</span></div>
    <span class="d pop" style="animation-delay: .05s; display: block; margin-top: 12px; font-size: 40px; white-space: nowrap; position: relative">{{title}}</span>
    <div class="pop" style="animation-delay: .08s; margin-top: 10px; display: flex; gap: 6px; background: rgba(22,17,13,.25); border-radius: 14px; padding: 4px; position: relative">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.pick}}" style="flex: 1 1 0; min-height: 36px; border-radius: 10px; border: 0; cursor: pointer; font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800; background: {{t.bg}}; color: {{t.fg}}">{{t.l}}</button></sc-for>
    </div>
  </div>
  <div style="margin: 12px 16px 0; display: flex; flex-direction: column; gap: 7px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div class="pop" style="animation-delay: {{r.dl}}; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 18px; background: {{r.bg}}; color: {{r.fg}}; box-shadow: 0 4px 0 {{r.sh}}">
        <span class="d" style="width: 26px; font-size: 22px">{{r.rk}}</span>
        <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><span class="d" style="font-size: 19px; white-space: nowrap">{{r.n}}</span><span style="font-size: 11px; font-weight: 700; opacity: .75">{{r.sub}}</span></span>
        <span class="d" style="font-size: 18px">{{r.xp}}</span>
      </div>
    </sc-for>
  </div>
  <div class="pop" style="animation-delay: .3s; margin: 12px 16px 0; padding: 12px 14px; border-radius: 20px; background: #16110D; color: #fff; display: flex; align-items: center; gap: 12px; box-shadow: 0 5px 0 #000">
    <img src="/_blob/1defd4a1483a03db93fc96c7d6adad94" alt="" aria-hidden="true" class="wob" style="width: 46px; height: 46px; object-fit: contain">
    <span style="display: flex; flex-direction: column; gap: 3px"><span class="d" style="font-size: 18px">{{gap}}</span><span style="font-size: 12px; font-weight: 600; color: #BDB2A6">1 ami invité = +200 XP · le gagnant débloque le décor Toits de Paris</span></span>
  </div>
  <a href="V3-Quartier.dc.html" class="btn b1 pop" style="animation-delay: .34s; margin: 12px 16px 24px; width: auto; margin-top: auto">Inviter des amis</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: 0 }; }
  renderVals() {
    const s = this.state;
    const D = [
      [['Paris 10e', '412 duos · série moy. 9 j', '18 420', 0], ['Paris 11e', 'Ton quartier · tu as donné 1 488 XP', '17 980', 1], ['Lyon 1er', '298 duos', '16 210', 0], ['Nantes · Île', '251 duos', '12 870', 0], ['Lille centre', '233 duos', '11 400', 0]],
      [['Sorbonne', '1 204 étudiants', '42 300', 0], ['Beaux-Arts', 'Ton école · 3ᵉ cette semaine', '39 870', 1], ['Sciences Po', '980 étudiants', '38 120', 0], ['EPITECH', '760 étudiants', '31 050', 0], ['HEC', '640 étudiants', '27 900', 0]]
    ];
    const rows = D[s.t].map(([n, sub, xp, me], i) => ({ n, sub, xp, rk: i + 1, dl: (0.1 + i * 0.04) + 's', bg: me ? '#C8F542' : '#fff', fg: '#16110D', sh: me ? '#7DA11A' : '#EEDFCB' }));
    return {
      rows, title: s.t ? 'LIGUE DES ÉCOLES' : 'LIGUE DES QUARTIERS',
      tabs: ['Quartiers', 'Écoles'].map((l, i) => ({ l, pick: () => this.setState({ t: i }), bg: s.t === i ? '#fff' : 'transparent', fg: s.t === i ? '#16110D' : '#fff' })),
      gap: s.t ? 'Plus que 2 430 XP sur la Sorbonne' : 'Plus que 440 XP pour passer le 10e'
    };
  }
}
</script>
</body>
</html>
