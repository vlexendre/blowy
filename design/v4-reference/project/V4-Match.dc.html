<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ses rendez-vous — blowy.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#16110D}
a{color:inherit;text-decoration:none}
.d{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-stretch:85%;letter-spacing:-.03em;line-height:.95}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
@keyframes pop{0%{transform:translateY(18px) scale(.94);opacity:0}60%{transform:translateY(-3px) scale(1.02);opacity:1}100%{transform:none;opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes sq{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-10px) scale(.96,1.05)}52%{transform:translateY(0) scale(1.05,.95)}}
.sq{animation:sq 2s cubic-bezier(.3,0,.2,1) infinite;transform-origin:50% 100%}
@keyframes peek{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
.peek{animation:peek 2.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}40%{transform:scale(1)}}
.beat{animation:beat 1.4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(170deg, #FF3D7F 0%, #FF5A3C 45%, #FFB347 100%); display: flex; flex-direction: column; overflow: hidden; padding: 52px 18px 22px; position: relative">
  <div class="blob" style="width: 300px; height: 300px; top: -40px; left: -140px; background: #7C3AED; opacity: .45"></div>
  <div class="blob" style="width: 300px; height: 300px; bottom: 40px; right: -150px; background: #FFE36E; opacity: .6"></div>

  <div class="pop" style="display: flex; align-items: center; justify-content: space-between; color: #fff; position: relative">
    <span class="d" style="font-size: 26px">blowy<span style="color: #16110D">.</span></span>
    <span class="chip" style="background: #16110D; color: #C8F542">{{quota}}</span>
  </div>

  <div class="pop" style="animation-delay: .06s; margin-top: 10px; display: flex; align-items: center; gap: 8px; position: relative">
    <img src="/_blob/2dd74281b0d1e96cdc17f174113da343" alt="Ton Nino" class="sq" style="width: 96px; height: 96px; object-fit: contain">
    <div style="display: flex; flex-direction: column; color: #fff">
      <span class="d" style="font-size: 36px; white-space: nowrap">NINO A</span>
      <span class="d" style="font-size: 36px; white-space: nowrap; color: #16110D">3 RENDEZ-VOUS.</span>
    </div>
  </div>

  <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px; position: relative">
    <sc-for list="{{dates}}" as="m" hint-placeholder-count="3">
      <div class="pop" style="animation-delay: {{m.dl}}; position: relative; overflow: hidden; background: #fff; border-radius: 22px; padding: 10px 12px; box-shadow: 0 5px 0 {{m.sh}}">
        <div style="display: flex; align-items: center; gap: 10px; filter: {{m.blur}}">
          <span style="width: 70px; height: 70px; border-radius: 20px; background: {{m.tint}}; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><img src="{{m.img}}" alt="{{m.alt}}" class="peek" style="width: 58px; height: 58px; object-fit: contain"></span>
          <div style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><span class="d" style="font-size: 22px">{{m.pet}}</span><span style="font-size: 12px; font-weight: 700; color: #6B6259">avec {{m.who}}</span></div>
            <span style="font-size: 12px; font-weight: 600; color: #6B6259; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.common}}</span>
            <div style="display: flex; align-items: center; gap: 6px"><span class="chip" style="background: {{m.badge}}; color: #16110D">{{m.score}} % de vision</span><span style="font-size: 11px; font-weight: 700; color: #8A7E70; white-space: nowrap">{{m.dist}}</span></div>
          </div>
        </div>
        <sc-if value="{{m.open}}" hint-placeholder-val="{{true}}">
          <a href="V4-Notifs.dc.html" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border-radius: 14px; background: #16110D; color: #fff; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800; box-shadow: 0 3px 0 #000; white-space: nowrap"><svg class="beat" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" fill="#FF3D7F"/></svg>LES FAIRE SE RENCONTRER</a>
        </sc-if>
        <sc-if value="{{m.locked}}" hint-placeholder-val="{{false}}">
          <a href="V4-Paywall.dc.html" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,247,236,.35)"><span class="chip" style="background: #7C3AED; color: #fff; font-size: 12px; padding: 8px 14px">Débloquer avec Blowy+</span></a>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div class="pop" style="animation-delay: .4s; margin-top: auto; display: flex; gap: 10px; align-items: center; background: rgba(22,17,13,.85); color: #fff; border-radius: 18px; padding: 10px 14px; position: relative">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M4 11l8-7 8 7v9H4z" fill="#C8F542"/></svg>
    <span style="font-size: 12px; font-weight: 600; line-height: 1.4">Au niveau 3 du Lien, Nino peut <strong style="color: #C8F542">emménager</strong> avec l'un d'eux. Là, ça devient exclusif.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plus":{"editor":"boolean","default":true,"section":"Démo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '/_blob/';
    const plus = this.props.plus ?? true;
    const D = [
      { pet: 'Suzie', who: 'L., 27 ans', img: B + '305ba56fa88f24706f7f7b30debf3ac8', tint: '#EDE4FF', score: 87, common: 'Beaux-Arts · rando · jamais ghoster', dist: '3 km', badge: '#C8F542' },
      { pet: 'Gaston', who: 'M., 29 ans', img: B + 'b9a1dfc49373cf092fdb8a912c875adf', tint: '#FFF1C9', score: 81, common: 'Sportif · Paris · concerts', dist: '5 km', badge: '#FFE36E' },
      { pet: 'Pia', who: 'S., 26 ans', img: B + '8a35794ced023a499838ce341afd6ac4', tint: '#DDF8E8', score: 78, common: 'Gentil · brunch · poterie', dist: '2 km', badge: '#FFE36E' }
    ];
    const dates = D.map((m, i) => { const locked = !plus && i > 0; return { ...m, alt: m.pet + ', le pet de ' + m.who, dl: (0.12 + i * 0.08) + 's', open: !locked, locked, blur: locked ? 'blur(5px)' : 'none', sh: i === 0 ? '#16110D' : '#C4341B' }; });
    return { dates, quota: plus ? 'BLOWY+ · 3 / 3' : 'GRATUIT · 1 / 1' };
  }
}
</script>
</body>
</html>
